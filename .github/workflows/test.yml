name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Show Forge and Solar versions
        run: forge --version && solar --version

      - name: Run Forge fmt
        run: forge fmt --check && forge fmt --check examples

      - name: Run Forge build
        run: forge build --sizes

      # Fails if any vm.snapshotGas* result differs from snapshots/, so the checked-in gas
      # numbers can't go stale.
      - name: Run Forge tests
        run: forge test -vvv --gas-snapshot-check true

      # Solar ships with Foundry and its code generation is experimental, so pagepack stays on
      # solc. Running the tests on Solar too catches incompatibilities early. Its gas differs
      # from solc's, so this run neither checks nor writes snapshots.
      - name: Run Forge tests with Solar
        run: forge test -vvv --use solar --gas-snapshot-emit false

      - name: Build a downstream consumer
        run: ./scripts/check-consumer.sh
